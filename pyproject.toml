[project]
name = "hikari-atsume"
version = "0.6.0"
description = "An opinionated, Django-like Discord bot framework for Hikari, Tanjun, and Ormar"
authors = [
    {name = "Peter DeVita", email = "mewtwo2643@yahoo.com>"}
]
readme = "Readme.md"
license = "MIT"
keywords = ["hikari", "discord", "piccolo", "bot", "framework"]
classifiers = [
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Chat",
    "Typing :: Typed"
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "hikari (>=2.5.0)",
    "click (>=8.1.6, <9.0.0)",
    "aiohttp (>=3.14.1, <4.0.0)",
    "aiosqlite (>=0.22.1, <1.0.0)",
    "hupper (>=1.12.1, <2.0.0)",
    "pydantic (>=2.5.3,<3.0.0)",
    "piccolo (>=1.35.0, <2.0.0)"
]

[project.urls]
homepage = "https://github.com/pmdevita/hikari-atsume"
repository = "https://github.com/pmdevita/hikari-atsume"
documentation = "https://pmdevita.github.io/hikari-atsume/"

[tool.poetry]
packages = [
    { include="atsume" },
]

[project.optional-dependencies]
postgresql = [
    "asyncpg (>=0.30.0, <1.0.0)",
    "psycopg2-binary (>=2.9.6, <3.0.0)"
]
postgres = [
    "asyncpg (>=0.30.0, <1.0.0)",
    "psycopg2-binary (>=2.9.6, <3.0.0)"
]
speedups = [
    "ciso8601 (>=2.3, <3.0)",
    "orjson (>=3.9, <4.0)",
    "aiodns (>=3.6.1, <4.0.0)",
    "brotli (>=1.0.9, <2.0.0)",
    "uvloop (>=0.22.1, <1.0.0) ; sys_platform == 'darwin' or sys_platform == 'linux'"
]


[tool.poetry.group.dev.dependencies]
myst-parser = "^2.0.0"
sphinx-autodoc2 = ">=0.4.2,<0.6.0"
sphinx-autoapi = ">=2.1.1,<4.0.0"
sphinxcontrib-asyncio = "^0.3.0"
mypy = {version = "^1.4.1"}
black = ">=23.7,<25.0"
pre-commit = "^3.3.3"
nox = "^2023.4.22"
nox-poetry = "^1.0.3"
sqlalchemy-stubs = "^0.4"
sphinx = "^7.0.1"
sphinx-reload = "^0.2.0"
furo = "^2023.07.26"
ruff = ">=0.6.3"

[tool.poetry.scripts]
atsume = "atsume.cli.project:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[isort]
profile = "black"
skip = ["atsume/templates/templates"]

[tool.ruff.lint]
ignore = [
    "E712"
]

[tool.ruff.lint.per-file-ignores]
"atsume/templates/templates/**/*" = ["F401", "F403"]
